[NM_EPD_420_BW_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = nm-epd-420-bw
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_flags =
  --before
  usb-reset
  --after
  watchdog-reset
build_flags =
  ${esp32_base.build_flags}
  -I variants/nm_epd_420_bw
  -D NM_EPD_420_BW
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D SX126X_POWER_EN=47
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=38
  -D PIN_DISPLAY_CS=46
  -D PIN_DISPLAY_BUSY=6
  -D PIN_DISPLAY_DC=4
  -D PIN_DISPLAY_RST=5
  -D PIN_DISPLAY_SCLK=2
  -D PIN_DISPLAY_MOSI=1
  -D PIN_DISPLAY_MISO=-1
  -D EINK_DISPLAY_MODEL=GxEPD2_420_GYE042A87
  -D EINK_SCALE_X=2.0f
  -D EINK_SCALE_Y=2.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=0
  -D EINK_WIDTH=400
  -D EINK_HEIGHT=300
  -D PIN_BOOT_BTN=0
  -D PIN_USER_BTN=45
  -D PIN_AMP_ENABLE=41
  -D PIN_ES8311_POWER=44
  -D AHTX0_POWER_PIN=40
  -D AHTX0_POWER_WARMUP_MS=50
  -D ENV_INCLUDE_AHTX0=1
  -D BATTERY_PIN=3
  -D PIN_ADC_CTRL=43
  -D ADC_MULTIPLIER=2.0f
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/nm_epd_420_bw>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  zinggjm/GxEPD2 @ ^1.6.8
  bakercp/CRC32 @ ^2.0.0
  adafruit/Adafruit AHTX0 @ ^2.0.5
  densaugeo/base64 @ ~1.4.0

[env:NM_EPD_420_BW_companion_radio_ble]
extends = NM_EPD_420_BW_base
build_flags =
  ${NM_EPD_420_BW_base.build_flags}
  -D DISPLAY_CLASS=NMEPD420Display
  -D DISPLAY_ROTATION=0
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${NM_EPD_420_BW_base.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
